    body { margin: 0; background: #000; display: flex; flex-direction: column; min-height: 100vh; }

    .image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 1100px; }
    .image-grid img { width: 100%; border-radius: 4px; object-fit: cover; }
